theme = "gruvbox_dark_hard"

[editor]
bufferline = "multiple"
#rulers = [150]
true-color = true

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.file-picker]
hidden = false

[editor.lsp]
auto-signature-help = false
display-messages = true

[editor.statusline]
left = ["mode", "spinner", "version-control", "file-name"]

[editor.indent-guides]
character = "|"
render = true

[keys.normal]
"A-," = "goto_previous_buffer"
"A-." = "goto_next_buffer"

# Extend "x" selections up if you select too many
"X" = ["extend_line_up", "extend_to_line_bounds"]

[keys.select]
"X" = ["extend_line_up", "extend_to_line_bounds"]
